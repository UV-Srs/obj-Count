services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipe_counter_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - pipe_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipe_counter_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - pipe_network

networks:
  pipe_network:
    driver: bridge
