services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipe_counter_backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - pipe_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipe_counter_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pipe_network

networks:
  pipe_network:
    driver: bridge
